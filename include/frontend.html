<!DOCTYPE html>
<html lang ="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Weather Station</title>


<style>
body {
    background-color: #ffffff ;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding-bottom: 60px;
}

h1 {
    text-align: center;
}

.subtitle {
    text-align: center;
}

.footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    text-align: center;
}


table {
    width: 80%;
    border-collapse:separate;
    border: 1px solid black;
    border-spacing: 0;
    border-radius: 15px;
    overflow: hidden;
    margin: 0 auto;
}

th {
    background-color: rgb(5, 203, 5);
}
th , td {
    padding: 10px;
    text-align: center;
    border-right: 1px solid black;
    border-bottom: 1px solid black;
}

th:last-child, td:last-child {
    border-right: none;
}

tr:last-child td {
    border-bottom: none;
}

</style>

</head>

<body>

  <div class="container">
    
    <h1>ESP32 Weather Station</h1>
    <p class = "subtitle">Live Monitoring with ESP32 Micro controller</p>

    <table>
        <tr>
            <th id = "Temperature Header">🌡️ Temperature</th>
            <th id = "Humidity Header">💦 Humidity</th>
            <th id = "Heat Index Header">🔥 Heat Index</th>
        </tr>
        <tr>
              <td id="temperature">-- °C</td>
              <td id="humidity">-- %</td>
              <td id="heatIndex">-- °C</td>
          </tr>
      </table>
      
      <div class="footer">
        <hr style= "width: 85%;">
        <p class = "footnote"><em>Accuracy: ± 2°C Temperature and ± 5% Relative Humidity </em></p>
        <p class = "attribution"><em> Made by Leouigi Kyle R. Placido for Project S.H.I.N.E (English Project) </em> </p>
      </div>
      
    </div>

    <script>
    async function updateData(){

      try {
      const response = await fetch("/api");

      if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
      }

      const json = await response.json();

      // Get all the data

      document.getElementById("temperature").innerHTML= json.temperature + " °C";
      document.getElementById("humidity").innerHTML=json.humidity + " %";
      document.getElementById("heatIndex").innerHTML=json.heatIndex + " °C";
      

      }
      catch (error){
      console.error("Error fetching data from sensor", error)
      }
    }

    updateData();
    setInterval(updateData, 2000);
    </script>
</body>

</html>
